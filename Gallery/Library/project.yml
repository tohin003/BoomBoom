# XcodeGen spec for the library UI demo app. Generate with:  /opt/homebrew/bin/xcodegen generate
# Shows the Library tab, Settings, History and the playlist sheets on canned data (PreviewMusicAPI).
# Launch arguments (read through UserDefaults):
#   -screen library|settings|history|newplaylist|editor|selfcheck
#   -signedin 0|1   -mode normal|empty|failreads|failwrites   -slow 1   -playing 1   -nodelay 1
name: BoomGalleryLibrary

options:
  bundleIdPrefix: io.github.tohin003
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  BoomFeatures:
    path: ../../Packages/BoomFeatures
  BoomEngine:
    path: ../../Packages/BoomEngine
  BoomCore:
    path: ../../Packages/BoomCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  BoomGalleryLibrary:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
    dependencies:
      - package: BoomFeatures
        product: FeatureBrowse
      - package: BoomFeatures
        product: BoomDesign
      - package: BoomEngine
        product: BoomPlayer
      - package: BoomCore
        product: BoomModels
    settings:
      base:
        PRODUCT_NAME: BoomGalleryLibrary
        PRODUCT_BUNDLE_IDENTIFIER: io.github.tohin003.boomgallery.library
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Library Gallery
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
